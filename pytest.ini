[pytest]
# The unit tests are stored in tests and named after the module they test,
# not test_*.py. Only unittest.TestCase subclasses contain unit tests, other
# classes, such as Test<Name> helper classes, should not be collected.
# The benchmark tests are stored in benchmarks and are functions named
# Benchmark<Name>.
addopts = --ignore=tests/end-to-end.py
python_classes =
python_files = *.py
python_functions = Benchmark*
testpaths = tests
